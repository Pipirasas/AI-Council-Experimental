name: Offline R0 Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Compile
        run: python -B -m compileall -q ai_council tests examples scripts
      - name: Public-tree policy
        run: python -B scripts/check_public_tree.py
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Demo
        run: python -B -m examples.offline_demo
